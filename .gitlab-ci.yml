# Build and test campo-stats on every MR / push
image: node:22-bookworm

stages:
  - test
  - release
  - data

default:
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

test:
  stage: test
  script:
    - npm ci
    - npm run build
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Publish to this project's GitLab Package Registry (not npmjs.com).
# Runs on version tags: v0.1.0, v1.2.3, …
publish_gitlab_package:
  stage: release
  needs: ["test"]
  script:
    - npm ci
    - npm run build
    - npm pack
    - |
      {
        echo "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/packages/npm/"
        echo "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
        echo "${CI_API_V4_URL#https:}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
        echo "registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      } > .npmrc
    - npm publish --registry "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    # Also upload the tarball to the Generic Package Registry for direct download.
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "campo-stats-${CI_COMMIT_TAG#v}.tgz" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/campo-stats/${CI_COMMIT_TAG#v}/campo-stats-${CI_COMMIT_TAG#v}.tgz"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
  environment:
    name: gitlab-packages
    url: https://gitlab.com/marina34/campus/-/packages

# Periodic fantasy data refresh (wire a Pipeline Schedule cron, e.g. 0 6 * * *).
# See docs/cron.md.
refresh_fantasy_data:
  stage: data
  script:
    - npm ci
    - npm run build
    - node dist/cli.js sync --fantasy
    - test -f .campo-stats/cache.json
    - |
      node -e '
        const fs = require("fs");
        const cache = JSON.parse(fs.readFileSync(".campo-stats/cache.json", "utf8"));
        const meta = {
          generatedAt: new Date().toISOString(),
          pipelineId: process.env.CI_PIPELINE_ID || null,
          commitSha: process.env.CI_COMMIT_SHA || null,
          competitions: cache.competitions?.length ?? 0,
          seasons: cache.seasons?.length ?? 0,
          teams: cache.teams?.length ?? 0,
          matches: cache.matches?.length ?? 0,
          players: cache.players?.length ?? 0,
          playerMatchStats: cache.playerMatchStats?.length ?? 0,
        };
        fs.writeFileSync(".campo-stats/meta.json", JSON.stringify(meta, null, 2) + "\n");
        console.log(JSON.stringify(meta, null, 2));
      '
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ".campo-stats/cache.json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/campo-stats-data/latest/cache.json"
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ".campo-stats/meta.json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/campo-stats-data/latest/meta.json"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  environment:
    name: fantasy-data
    url: https://gitlab.com/marina34/campus/-/packages
