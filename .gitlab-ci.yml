# Build and test campo-stats on every MR / push
image: node:22-bookworm

stages:
  - test
  - release

default:
  interruptible: true

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

test:
  stage: test
  script:
    - npm ci
    - npm run build
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Publish to npm when a version tag is pushed (requires CI/CD variable NPM_TOKEN).
publish:
  stage: release
  needs: ["test"]
  script:
    - npm ci
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
  environment:
    name: npm
    url: https://www.npmjs.com/package/campo-stats
